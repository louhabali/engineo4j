<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- RED GRADIENT FOR BACKBARS -->
    <linearGradient id="netflixRedDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B1060F"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>

    <!-- RED GRADIENT FOR FRONT FOLD -->
    <linearGradient id="netflixRedBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="100%" stop-color="#B1060F"/>
    </linearGradient>

    <!-- DROP SHADOW FOR 3D RIBBON FOLD EFFECT -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- SPIDER-MAN/NETFLIX AMBIENT GLOW -->
    <filter id="spideyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#E50914" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- DARK BACKGROUND ICON TILE WITH ARCHED BASE CUTOUT -->
  <g filter="url(#spideyGlow)">
    <rect width="512" height="512" rx="96" fill="#08070A"/>
  </g>

  <!-- NETFLIX STYLE RIBBON "E" -->
  <g filter="url(#spideyGlow)">
    <!-- VERTICAL BACK SPINE -->
    <rect x="120" y="80" width="70" height="352" fill="url(#netflixRedDark)"/>

    <!-- TOP HORIZONTAL BAR -->
    <rect x="190" y="80" width="190" height="65" fill="url(#netflixRedDark)"/>

    <!-- BOTTOM HORIZONTAL BAR -->
    <rect x="190" y="367" width="190" height="65" fill="url(#netflixRedDark)"/>

    <!-- MIDDLE DIAGONAL / ACCENT RIBBON (OVERLAY WITH SHADOW) -->
    <polygon points="120,225 340,225 310,290 120,290" fill="url(#netflixRedBright)" filter="url(#ribbonShadow)"/>
  </g>
</svg>
