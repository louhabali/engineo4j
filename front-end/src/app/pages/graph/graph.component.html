<div class="min-h-screen bg-bg-primary text-gray-200 font-mono p-6 md:p-10 flex flex-col justify-between">
  
  <!-- HEADER -->
  <header class="flex justify-between items-center pb-6 border-b border-gray-800">
    <div>
      <a routerLink="/" class="font-netflix text-3xl text-brand-red spidey-glow-text">ENGINEO</a>
      <p class="text-[10px] text-gray-500">NEO4J GRAPH TRAVERSAL VISUALIZER</p>
    </div>
    <a routerLink="/catalog" class="text-xs text-gray-400 hover:text-white transition-colors">← RETURN TO CATALOG</a>
  </header>

  <!-- MAIN GRAPH INTERFACE -->
  <main class="my-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
    
    <!-- LEFT: VISUAL NODE MESH CANVAS -->
    <div class="lg:col-span-8 bg-[#0B0A0F] border border-gray-800 rounded-xl p-6 relative overflow-hidden flex flex-col justify-between min-h-[400px]">
      <div class="flex justify-between items-center z-10">
        <span class="text-xs text-brand-red font-semibold">LIVE GRAPH MESH</span>
        <span class="text-[10px] bg-brand-red/10 border border-brand-red/40 text-brand-red px-2.5 py-1 rounded-full">ACTIVE QUERY</span>
      </div>

      <!-- SIMULATED GRAPH NETWORK INTERACTION -->
      <div class="my-auto grid grid-cols-2 sm:grid-cols-4 gap-4 z-10">
        <button 
          *ngFor="let node of nodes" 
          (click)="selectNode(node)"
          [class.border-brand-red]="selectedNode.id === node.id"
          [class.shadow-spidey-glow]="selectedNode.id === node.id"
          class="p-4 bg-black/60 border border-gray-800 rounded-lg text-center hover:border-brand-red/60 transition-all duration-300">
          <span class="text-xs font-netflix text-white block truncate">{{ node.label }}</span>
          <span class="text-[9px] text-gray-500 uppercase">{{ node.type }} NODE</span>
        </button>
      </div>

      <!-- CYPHER QUERY CONSOLE -->
      <div class="bg-black/80 border border-gray-800/80 p-3 rounded text-[10px] text-gray-400 font-mono z-10 space-y-1">
        <p class="text-gray-500">// EXECUTED CYPHER QUERY:</p>
        <p class="text-red-400/90 whitespace-pre-wrap">{{ cypherQuery }}</p>
      </div>
    </div>

    <!-- RIGHT: NODE INSPECTOR PANEL -->
    <div class="lg:col-span-4 bg-[#0B0A0F] border border-gray-800 rounded-xl p-6 space-y-6">
      <div class="space-y-1 border-b border-gray-800 pb-4">
        <h3 class="font-netflix text-2xl text-white tracking-wider">NODE DETAILS</h3>
        <p class="text-xs text-brand-red">{{ selectedNode.label }}</p>
      </div>

      <div class="space-y-4 text-xs">
        <div>
          <label class="text-[10px] text-gray-500 uppercase block">Node ID</label>
          <p class="text-gray-300">{{ selectedNode.id }}</p>
        </div>

        <div>
          <label class="text-[10px] text-gray-500 uppercase block">Type</label>
          <p class="text-gray-300 uppercase">{{ selectedNode.type }}</p>
        </div>

        <div>
          <label class="text-[10px] text-gray-500 uppercase block mb-2">Connected Vertices</label>
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let conn of selectedNode.connections" class="bg-brand-red/10 border border-brand-red/30 text-red-300 px-2.5 py-1 rounded text-[10px]">
              {{ conn }}
            </span>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="text-center text-[10px] text-gray-600 border-t border-gray-800/80 pt-4">
    ENGINEO GRAPH INFRASTRUCTURE &copy; 2026
  </footer>

</div>
