server:
  port: 8084

spring:
  application:
    name: recommendation-service
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_USERNAME:neo4j}
      password: ${SPRING_NEO4J_PASSWORD:password}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: recommendation-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.cinema.recommendation.event
        # spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.cinema.recommendation.event.MovieRatedEvent
        spring.json.use.type.headers: false

logging:
  level:
    root: INFO
    com.cinema.recommendation: DEBUG