server:
  port: 8089

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        # 1. User Service
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**

        # 2. Movie Service
        - id: movie-service
          uri: ${MOVIE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/movies/**

        # 3. Rating Service
        - id: rating-service
          uri: ${RATING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/ratings/**

        # 4. Recommendation Service
        - id: recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/recommendations/**

jwt:
  secret: ${JWT_SECRET:your_super_secret_key_that_is_at_least_32_bytes_long}
  # expiration: 86400000

logging:
  level:
    root: INFO
    com.cinema.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
management:
  tracing:
    sampling:
      probability: 1.0