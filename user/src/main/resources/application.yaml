server:
  port: 8081

spring:
  application:
    name: user
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: pgadmin
    password: pgpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET:your_super_secret_key_that_is_at_least_32_bytes_long}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.cinema.movie: DEBUG