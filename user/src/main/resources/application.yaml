server:
  port: 8081

spring:
  application:
    name: user
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://example.invalid:5432/example_db}
    username: ${SPRING_DATASOURCE_USERNAME:example_user}
    password: ${SPRING_DATASOURCE_PASSWORD:example_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:example.invalid}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:example_only_not_a_real_jwt_secret}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.cinema.movie: DEBUG
