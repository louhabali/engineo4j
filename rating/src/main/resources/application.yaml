server:
  port: 8083

spring:
  application:
    name: rating-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://example.invalid:5432/example_db}
    username: ${SPRING_DATASOURCE_USERNAME:example_user}
    password: ${SPRING_DATASOURCE_PASSWORD:example_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:example.invalid:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    root: INFO
    com.cinema.rating: DEBUG