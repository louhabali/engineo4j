services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8089:8089"
    depends_on:
      - user-service
      - movie-service
      - postgres
    environment:
      # SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      MOVIE_SERVICE_URL: ${MOVIE_SERVICE_URL}
      # RECOMMENDATION_SERVICE_URL: ${RECOMMENDATION_SERVICE_URL}
      # RATING_SERVICE_URL: ${RATING_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD}
  user-service:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      USER_DB_URI: ${USER_DB_URI}

  movie-service:
    build:
      context: ./movie
      dockerfile: Dockerfile
    container_name: movie-service
    ports:
      - "8082:8082"
    environment:
      MOVIE_DB_URI: ${MOVIE_DB_URI}

  postgres:
    image: postgres:15-alpine
    container_name: movie_postgres
    environment:
      POSTGRES_DB: movie_db
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: pgpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: movie_redis
    ports:
      - "6379:6379"
volumes:
  pgdata:
