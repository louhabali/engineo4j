services:
  postgres:
    image: postgres:15-alpine
    container_name: neo4flix-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: pgpass
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - neo4flix-net

  redis:
    image: redis:7-alpine
    container_name: movie_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - neo4flix-net

  neo4j:
    image: neo4j:5.15-community
    container_name: neo4flix-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-password}' 'RETURN 1' >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - neo4flix-net

  kafka-service:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-service
    ports:
      - "9092:9092"
    # environment:
    #   CLUSTER_ID: ${KAFKA_CLUSTER_ID:MkU3OEVBNTcwNTJENDM2Qk}
    #   KAFKA_NODE_ID: 1
    #   KAFKA_PROCESS_ROLES: broker,controller
    #   KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    #   KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092
    #   KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    #   KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    #   KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-service:9093
    #   KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    #   KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    #   KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    #   KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    #   KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    #   KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-service:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-service:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - neo4flix-net

  user-service:
    build: ./user
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: pgadmin
      SPRING_DATASOURCE_PASSWORD: pgpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_key_that_is_at_least_32_bytes_long}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neo4flix-net

  movie-service:
    build: ./movie
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/movie_db
      SPRING_DATASOURCE_USERNAME: pgadmin
      SPRING_DATASOURCE_PASSWORD: pgpass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neo4flix-net

  rating-service:
    build: ./rating
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rating_db
      SPRING_DATASOURCE_USERNAME: pgadmin
      SPRING_DATASOURCE_PASSWORD: pgpass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-service:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-service:
        condition: service_healthy
    networks:
      - neo4flix-net

  recommendation-service:
    build: ./recommendation
    environment:
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_USERNAME: neo4j
      SPRING_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-service:29092
    depends_on:
      neo4j:
        condition: service_healthy
      kafka-service:
        condition: service_healthy
    networks:
      - neo4flix-net

  gateway:
    build: ./gateway
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:8081
      MOVIE_SERVICE_URL: http://movie-service:8082
      RATING_SERVICE_URL: http://rating-service:8083
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8084
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_key_that_is_at_least_32_bytes_long}
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      movie-service:
        condition: service_started
      rating-service:
        condition: service_started
      recommendation-service:
        condition: service_started
    ports:
      - "8089:8089"
    networks:
      - neo4flix-net

  frontend:
    build: ./front-end
    depends_on:
      - gateway
    # ports:
    #   - "${FRONTEND_PORT:-4200}:80"
    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./front-end/certs:/etc/nginx/certs:ro
    networks:
      - neo4flix-net

volumes:
  pgdata:


networks:
  neo4flix-net:
    driver: bridge
